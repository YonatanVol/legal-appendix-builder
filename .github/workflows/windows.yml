name: Windows

# Every push is built into an installer on a real Windows machine, installed the way a
# user installs it, launched, and made to produce a filing. A tag like v1.3.0 then
# publishes that verified installer as a GitHub release, and installed copies update
# themselves from it.
#
# Why this exists: the 1.2.0 download failed on the first real Windows machine with
# "ffmpeg.dll was not found", and until then no test had ever run on Windows.

on:
  # The code repository is private, where Actions minutes are metered and Windows minutes
  # count double. The full pipeline runs for main, for version tags and for pull requests,
  # not for every push to every branch.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    # Weekly: install the published release and have it ask the real GitHub for updates.
    # If GitHub changes the hosts it serves downloads from, this fails and GitHub emails
    # the repository owner, instead of installed copies silently never updating.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      reproduce_zip_bug:
        description: Also reproduce the 1.2.0 failure (the program run without its folder)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Keyed by event as well: the weekly schedule also runs on main, and must neither
  # cancel the verification of a push to main nor be cancelled by one.
  group: windows-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-and-verify:
    name: Build, install and run on Windows
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configuration checks
        run: |
          node test/config.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node test/selftest-verdicts.js

      - name: Build the installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: The unpacked program can start from its folder
        run: node scripts/check-win-package.js dist/win-unpacked

      - name: Reproduce the 1.2.0 failure
        if: ${{ github.event.inputs.reproduce_zip_bug == 'true' }}
        continue-on-error: true
        run: |
          $alone = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\exe-alone"
          Copy-Item dist\win-unpacked\AppendixBuilder.exe $alone
          node scripts/check-win-package.js $alone
          $p = Start-Process "$alone\AppendixBuilder.exe" -PassThru
          if ($p.WaitForExit(30000)) {
            Write-Host ("the program ended with 0x{0:X8} (0xC0000135 is STATUS_DLL_NOT_FOUND)" -f $p.ExitCode)
          } else {
            Write-Host 'no exit within 30s: Windows is holding the "was not found" error dialog open'
            Stop-Process $p -Force
          }

      - name: Install it the way a user would
        run: |
          $setup = Get-ChildItem dist -Filter 'AppendixBuilder-Setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'no installer was built' }
          Write-Host ("installer: {0} ({1:N1} MB)" -f $setup.Name, ($setup.Length / 1MB))
          $p = Start-Process $setup.FullName -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "the installer exited with $($p.ExitCode)" }
          Start-Sleep -Seconds 3
          Get-Process AppendixBuilder -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'AppendixBuilder.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'the installed program was not found under %LOCALAPPDATA%\Programs' }
          Write-Host "installed to: $($exe.DirectoryName)"
          "INSTALL_DIR=$($exe.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $menu = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter '*.lnk' -ErrorAction SilentlyContinue
          Write-Host "start-menu shortcuts: $(($menu | ForEach-Object Name) -join ', ')"

      - name: A first install does not crash, over 15 clean installs
        run: |
          # The 1.3.0 installer crashed with 0xC0000005 in System.dll on some machines, and
          # only on a first install: its lookup of the per-user Programs folder runs only
          # when no earlier install is recorded under HKCU. Installing over an existing
          # install skips that code entirely, so every round first uninstalls completely.
          # The crash also depends on the machine, so a clean run here is evidence, not
          # proof; test/config.js checks the installer template itself.
          $setup = (Get-ChildItem dist -Filter 'AppendixBuilder-Setup-*.exe' | Select-Object -First 1).FullName
          function Get-RecordedInstall {
            Get-ChildItem HKCU:\Software -ErrorAction SilentlyContinue | ForEach-Object {
              $loc = (Get-ItemProperty $_.PSPath -Name InstallLocation -ErrorAction SilentlyContinue).InstallLocation
              if ($loc -like '*rotem-office*') { $loc }
            }
          }
          function Uninstall-Completely {
            Get-Process AppendixBuilder -ErrorAction SilentlyContinue | Stop-Process -Force
            $uninstaller = Get-ChildItem $env:INSTALL_DIR -Filter 'Uninstall*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($uninstaller) { Start-Process $uninstaller.FullName -ArgumentList '/S' -Wait }
            # The uninstaller hands off to a copy of itself, so wait for the files and the record to go.
            $deadline = (Get-Date).AddSeconds(90)
            while (((Test-Path "$env:INSTALL_DIR\AppendixBuilder.exe") -or (Get-RecordedInstall)) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
            if (Test-Path "$env:INSTALL_DIR\AppendixBuilder.exe") { throw 'uninstall did not remove the program' }
            if (Get-RecordedInstall) { throw 'uninstall left the install recorded, so the next install would not be a first install' }
          }
          $failures = 0
          for ($i = 1; $i -le 15; $i++) {
            Uninstall-Completely
            $p = Start-Process $setup -ArgumentList '/S' -PassThru -Wait
            if ($p.ExitCode -ne 0) {
              $failures++
              Write-Host ("clean install {0}: exit {1} (0x{2:X8})" -f $i, $p.ExitCode, ($p.ExitCode -band 0xFFFFFFFF))
            } elseif (-not (Test-Path "$env:INSTALL_DIR\AppendixBuilder.exe")) {
              $failures++
              Write-Host "clean install ${i}: exit 0 but the program is not there"
            }
          }
          Get-Process AppendixBuilder -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($failures) { throw "$failures of 15 clean installs failed" }
          Write-Host 'all 15 clean installs succeeded'

      - name: The installed program can start from where it was installed
        run: node scripts/check-win-package.js "$env:INSTALL_DIR"

      - name: Launch the installed program and have it produce a filing
        run: node scripts/run-selftest.js "$env:RUNNER_TEMP\selftest.json" -- "$env:INSTALL_DIR\AppendixBuilder.exe"

      - name: A second launch hands over to the window already open
        env:
          APPENDIX_BUILDER_DISABLE_UPDATES: '1'
        run: |
          $exe = "$env:INSTALL_DIR\AppendixBuilder.exe"
          $first = Start-Process $exe -PassThru
          Start-Sleep -Seconds 10
          if ($first.HasExited) { throw "the program closed on its own (code $($first.ExitCode))" }
          $second = Start-Process $exe -PassThru
          if (-not $second.WaitForExit(30000)) { throw 'the second launch neither handed over nor exited' }
          Start-Sleep -Seconds 2
          if ($first.HasExited) { throw 'the open window closed when the program was launched again' }
          Write-Host "second launch exited with $($second.ExitCode); the first is still running"
          Get-Process AppendixBuilder -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2

      - name: The installed program's own update settings point at this repository
        run: node scripts/check-update-config.js "$env:INSTALL_DIR"

      - name: With those settings it reaches the real GitHub through its network rule
        run: node scripts/run-selftest.js "$env:RUNNER_TEMP\github-reachable.json" --expect github-reachable --env APPENDIX_BUILDER_SELFTEST_UPDATE_CHECK=github -- "$env:INSTALL_DIR\AppendixBuilder.exe"

      - name: Build a newer version to update to
        run: |
          npm version 99.0.0 --no-git-tag-version --allow-same-version | Out-Null
          npx electron-builder --win nsis --x64 --publish never "-c.directories.output=dist-next"
          $code = $LASTEXITCODE
          git checkout -- package.json package-lock.json
          if ($code -ne 0) { throw 'building the newer version failed' }
          Get-ChildItem dist-next -File | ForEach-Object { Write-Host "$($_.Name)  $($_.Length)" }

      - name: A tampered update is refused
        run: |
          New-Item -ItemType Directory -Force dist-tampered | Out-Null
          Copy-Item dist-next\latest.yml dist-tampered\
          Copy-Item dist-next\AppendixBuilder-Setup-99.0.0.exe dist-tampered\
          # Change the installer without changing the checksum published beside it.
          $f = [IO.File]::Open("$PWD\dist-tampered\AppendixBuilder-Setup-99.0.0.exe", 'Open', 'ReadWrite')
          $f.Seek(-64, 'End') | Out-Null; $f.WriteByte(0x41); $f.Close()
          $server = Start-Process node -ArgumentList 'scripts/serve-dir.js','dist-tampered','8322' -PassThru -NoNewWindow
          Start-Sleep -Seconds 2
          node scripts/run-selftest.js "$env:RUNNER_TEMP\update-tampered.json" --expect update-rejected --env APPENDIX_BUILDER_SELFTEST_UPDATE_FEED=http://127.0.0.1:8322/ -- "$env:INSTALL_DIR\AppendixBuilder.exe"
          $code = $LASTEXITCODE
          Stop-Process $server -Force
          Start-Sleep -Seconds 5
          $v = (Get-Item "$env:INSTALL_DIR\AppendixBuilder.exe").VersionInfo.ProductVersion
          Write-Host "installed version afterwards: $v"
          if ($code -ne 0) { exit $code }
          if ($v -like '99.*') { throw 'the tampered update was installed' }
          Remove-Item "$env:LOCALAPPDATA\*-updater" -Recurse -Force -ErrorAction SilentlyContinue

      - name: A genuine update downloads and installs
        run: |
          $server = Start-Process node -ArgumentList 'scripts/serve-dir.js','dist-next','8321' -PassThru -NoNewWindow
          Start-Sleep -Seconds 2
          node scripts/run-selftest.js "$env:RUNNER_TEMP\update.json" --env APPENDIX_BUILDER_SELFTEST_UPDATE_FEED=http://127.0.0.1:8321/ -- "$env:INSTALL_DIR\AppendixBuilder.exe"
          $code = $LASTEXITCODE
          $exe = "$env:INSTALL_DIR\AppendixBuilder.exe"
          $deadline = (Get-Date).AddMinutes(5)
          $v = ''
          while ($code -eq 0 -and $v -notlike '99.*' -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 3
            $v = (Get-Item $exe -ErrorAction SilentlyContinue).VersionInfo.ProductVersion
            Write-Host "installed version: $v"
          }
          Stop-Process $server -Force
          if ($code -ne 0) { exit $code }
          if ($v -notlike '99.*') { throw 'the update was downloaded but never installed' }
          # Let the silent installer finish writing before the next launch.
          $deadline = (Get-Date).AddMinutes(2)
          while ((Get-Process | Where-Object { $_.Path -like "*AppendixBuilder-Setup*" -or $_.Path -like "*\Temp\*.tmp" }) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          Start-Sleep -Seconds 5

      - name: The updated program still works
        run: |
          node scripts/run-selftest.js "$env:RUNNER_TEMP\selftest-updated.json" -- "$env:INSTALL_DIR\AppendixBuilder.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $r = Get-Content "$env:RUNNER_TEMP\selftest-updated.json" -Raw | ConvertFrom-Json
          if ($r.version -ne '99.0.0') { throw "expected the updated program to be 99.0.0, it reports $($r.version)" }

      - name: Keep the verified installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/AppendixBuilder-Setup-*.exe
            dist/AppendixBuilder-Setup-*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

      - name: Keep the self-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-results
          path: ${{ runner.temp }}/*.json
          if-no-files-found: ignore

  release:
    name: Publish the release
    needs: build-and-verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release

      - name: The tag, the code and the installer agree on the version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          YML=$(grep -m1 '^version:' release/latest.yml | awk '{print $2}')
          echo "tag=$TAG package=$PKG installer=$YML"
          test "$TAG" = "$PKG"
          test "$PKG" = "$YML"
          test -f "release/AppendixBuilder-Setup-$PKG.exe"

      - name: Notes from the changelog
        run: node scripts/release-notes.js "${GITHUB_REF_NAME#v}" > notes.md

      - name: Publish to the public releases repository
        env:
          # A fine-grained token that may write only to the releases repository. It lives in
          # this repository's Actions secrets and nowhere else, never inside the app.
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          OWNER=$(awk '/^publish:/{f=1} f && /^  owner:/{print $2; exit}' electron-builder.yml)
          REPO=$(awk '/^publish:/{f=1} f && /^  repo:/{print $2; exit}' electron-builder.yml)
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The RELEASES_TOKEN secret is missing, so nothing can be published to $OWNER/$REPO. See README, Building and releasing."
            exit 1
          fi
          # Also under a name without the version, so one link always downloads the newest:
          # https://github.com/<owner>/<repo>/releases/latest/download/AppendixBuilder-Setup.exe
          cp "release/AppendixBuilder-Setup-${GITHUB_REF_NAME#v}.exe" release/AppendixBuilder-Setup.exe
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$OWNER/$REPO" \
            --title "Appendix Builder ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md

  live-update-check:
    name: The published release updates from the real GitHub
    needs: release
    # After a release, and on the weekly schedule. `always()` lets the schedule run even
    # though the release job is skipped then.
    if: ${{ always() && (needs.release.result == 'success' || github.event_name == 'schedule') }}
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The release token still works
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          # Fine-grained tokens expire. Checked every week, so an expired one shows up as a
          # failed scheduled run and an email, not as a release that cannot be published.
          $owner = (Select-String -Path electron-builder.yml -Pattern '^  owner: (.+)$').Matches[0].Groups[1].Value
          $repo = (Select-String -Path electron-builder.yml -Pattern '^  repo: (.+)$').Matches[0].Groups[1].Value
          "RELEASES_REPO=$owner/$repo" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if (-not $env:GH_TOKEN) { throw 'The RELEASES_TOKEN secret is missing' }
          $canWrite = gh api "repos/$owner/$repo" --jq '.permissions.push'
          if ($LASTEXITCODE -ne 0 -or $canWrite -ne 'true') { throw "RELEASES_TOKEN can no longer publish to $owner/$repo (expired or revoked?)" }
          $visibility = gh api "repos/$owner/$repo" --jq '.visibility'
          if ($visibility -ne 'public') { throw "$owner/$repo is $visibility; installed copies can only update from a public repository" }
          Write-Host "RELEASES_TOKEN can publish to $owner/$repo, which is public"

      - name: Download the published installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          if ($tag) { gh release download $tag --repo $env:RELEASES_REPO --pattern 'AppendixBuilder-Setup-*.exe' --dir published }
          else { gh release download --repo $env:RELEASES_REPO --pattern 'AppendixBuilder-Setup-*.exe' --dir published }
          Get-ChildItem published | ForEach-Object { Write-Host "$($_.Name)  $($_.Length)" }

      - name: The permanent download link serves this installer
        run: |
          # The link handed to new users never changes. It must resolve to the newest release,
          # byte for byte, without a GitHub login.
          $versioned = Get-ChildItem published -Filter 'AppendixBuilder-Setup-*.exe' | Select-Object -First 1
          $link = "https://github.com/$env:RELEASES_REPO/releases/latest/download/AppendixBuilder-Setup.exe"
          Invoke-WebRequest $link -OutFile "$env:RUNNER_TEMP\via-link.exe"
          $expected = (Get-FileHash $versioned.FullName -Algorithm SHA512).Hash
          $actual = (Get-FileHash "$env:RUNNER_TEMP\via-link.exe" -Algorithm SHA512).Hash
          if ($actual -ne $expected) { throw "$link does not serve $($versioned.Name)" }
          Write-Host "OK: $link serves $($versioned.Name)"

      - name: Install it
        run: |
          $setup = Get-ChildItem published -Filter 'AppendixBuilder-Setup-*.exe' | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "the installer exited with $($p.ExitCode)" }
          Start-Sleep -Seconds 3
          Get-Process AppendixBuilder -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'AppendixBuilder.exe' | Select-Object -First 1
          if (-not $exe) { throw 'the installed program was not found' }
          "INSTALL_DIR=$($exe.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Ask the real GitHub for updates through the installed app's network rule
        run: |
          # GitHub can take a little while to list a release it has just published. Only
          # that answer is waited out; any other failure fails at once.
          $result = "$env:RUNNER_TEMP\live-update.json"
          for ($attempt = 1; $attempt -le 10; $attempt++) {
            node scripts/run-selftest.js $result --env APPENDIX_BUILDER_SELFTEST_UPDATE_CHECK=github -- "$env:INSTALL_DIR\AppendixBuilder.exe"
            if ($LASTEXITCODE -eq 0) { exit 0 }
            $r = if (Test-Path $result) { Get-Content $result -Raw | ConvertFrom-Json } else { $null }
            $reason = if ($r -and $r.update) { "$($r.update.error)" } else { '' }
            if ($reason -notmatch 'No published versions|please ensure a production release exists') { exit 1 }
            Write-Host "GitHub does not list the release yet (attempt $attempt of 10); waiting 30 seconds"
            Start-Sleep -Seconds 30
          }
          throw 'GitHub still lists no release after five minutes'
