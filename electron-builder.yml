appId: com.rotem.office.appendixbuilder
productName: בונה תיקי נספחים
copyright: ""

directories:
  output: dist
  buildResources: assets

# Only the application itself ships; fixtures and test output stay behind.
files:
  - src/**/*
  - assets/fonts/**/*
  - package.json
  - "!**/*.map"

npmRebuild: false

# Releases are published by .github/workflows/windows.yml, which builds the installer on
# a real Windows machine, installs it, launches it and has it produce a filing before
# anything is released. The installed app reads this to find its updates.
#
# The source code lives in a private repository. Installers and update files go to this
# separate public one, which holds no code, so installed copies can update without any
# credential inside the app.
publish:
  provider: github
  owner: YonatanVol
  repo: appendix-builder-releases
  releaseType: release

win:
  # electron-builder converts this 1024x1024 PNG into a multi-resolution .ico.
  icon: assets/icon.png
  # ASCII, so the installer, the updater and any command line never meet an encoding
  # problem. The Hebrew name is what she sees: shortcuts, window title, uninstall entry.
  executableName: AppendixBuilder
  target:
    - target: nsis
      arch: [x64]

# One file she double-clicks. The 1.2.0 zip let the program be run without the files
# beside it, and it failed with "ffmpeg.dll was not found" before a window appeared.
nsis:
  oneClick: true
  perMachine: false        # installs for her alone, no administrator prompt
  allowElevation: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: בונה תיקי נספחים
  deleteAppDataOnUninstall: false   # keep her history if she reinstalls
  artifactName: "AppendixBuilder-Setup-${version}.${ext}"
